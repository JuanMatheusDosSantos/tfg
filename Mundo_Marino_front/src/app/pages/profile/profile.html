@if (!user()) {
  <div class="d-flex align-items-center justify-content-center py-5">
    <div class="spinner-border" style="color:#FF7E54;" role="status"></div>
  </div>
} @else if (user(); as u) {
  <div class="d-flex flex-column">
    <div class="d-flex flex-grow-1 justify-content-center py-5"  style="background:#f5f8f8;">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5">

        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-5 flex-wrap gap-3">
          <div class="d-flex align-items-center gap-4">
            <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
                 style="width:56px;height:56px;font-size:1.2rem;background:#FF7E54;flex-shrink:0;">
              {{ iniciales(u.name) }}
            </div>
            <div>
              <h2 class="fw-bold mb-0" style="font-size:1.4rem;color:#0f172a;">{{ u.name }}</h2>
              <span class="badge rounded-pill px-3 py-1 fw-bold"
                    style="background:#fff7ed;color:#FF7E54;font-size:0.7rem;letter-spacing:0.05em;">
            {{ roleLabel(u.role) }}
          </span>
            </div>
          </div>

          <button class="btn fw-bold px-4 py-2 text-white rounded-3 d-flex align-items-center gap-2"
                  style="background:#FF7E54;"
                  (click)="editarPerfil()">
            <span class="material-icons" style="font-size:1rem;">edit</span>
            Actualizar Perfil
          </button>
        </div>

        <!-- Info Grid -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="rounded-3 d-flex align-items-center justify-content-center"
               style="width:44px;height:44px;background:#fff7ed;flex-shrink:0;">
            <span class="material-icons" style="color:#FF7E54;">badge</span>
          </div>
          <h5 class="fw-bold mb-0" style="color:#0f172a;">Información Personal</h5>
        </div>

        <div class="row g-4 mb-2">
          <div class="col-12 col-md-6">
            <p class="text-uppercase fw-bold mb-1"
               style="font-size:0.65rem;letter-spacing:0.15em;color:#94a3b8;">Nombre Completo</p>
            <p class="fw-semibold mb-0" style="font-size:1.05rem;color:#0f172a;">{{ u.name }}</p>
          </div>

          <div class="col-12 col-md-6">
            <p class="text-uppercase fw-bold mb-1"
               style="font-size:0.65rem;letter-spacing:0.15em;color:#94a3b8;">Rol</p>
            <p class="fw-semibold mb-0" style="font-size:1.05rem;color:#0f172a;">
              {{ roleLabel(u.role) }}
            </p>
          </div>

          <div class="col-12 col-md-6">
            <p class="text-uppercase fw-bold mb-1"
               style="font-size:0.65rem;letter-spacing:0.15em;color:#94a3b8;">Teléfono</p>
            <p class="fw-semibold mb-0" style="font-size:1.05rem;color:#0f172a;">
              {{ u.phone ?? '—' }}
            </p>
          </div>


          <div class="col-12 col-md-6">
            <p class="text-uppercase fw-bold mb-1"
               style="font-size:0.65rem;letter-spacing:0.15em;color:#94a3b8;">Correo Electrónico</p>
            <p class="fw-semibold mb-0" style="font-size:1.05rem;color:#0f172a;">{{ u.email }}</p>
          </div>
        </div>

      </div>
    </div>
  </div>
}
