<div class="d-flex flex-column" style="min-height:100vh;">
  <div class="d-flex flex-grow-1">
    <app-admin-sidebar />
    <main class="flex-grow-1 overflow-auto p-4 p-lg-5" style="background:#f5f8f8;">

      <div class="d-flex align-items-center gap-3 mb-4">
        <button class="btn btn-light rounded-3 d-flex align-items-center gap-1" (click)="volver()">
          <span class="material-symbols-outlined" style="font-size:1.1rem;">arrow_back</span>
        </button>
        <div>
          <h1 class="fw-bold mb-0" style="font-size:1.6rem;">Nuevo Restaurante</h1>
          <p class="text-muted small mb-0">Rellena los datos para crear un nuevo restaurante</p>
        </div>
      </div>

      @if (exito()) {
        <div class="alert alert-success d-flex align-items-center gap-2">
          <span class="material-symbols-outlined">check_circle</span>
          {{ exito() }}
        </div>
      }
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5">
            <h5 class="fw-bold mb-4">Datos del Restaurante</h5>

            <!-- Nombre -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Nombre</label>
              <input type="text" class="form-control rounded-3"
                     [value]="name()"
                     (input)="name.set($any($event.target).value)"
                     placeholder="Nombre del restaurante" />
            </div>

            <!-- Capacidad -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Capacidad máx.</label>
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-light rounded-3 px-3"
                        (click)="max_capacity.set(Math.max(1, max_capacity() - 1))">−</button>
                <input type="number" class="form-control rounded-3 text-center fw-bold"
                       style="width:70px;"
                       [value]="max_capacity()"
                       (change)="max_capacity.set(Math.max(1, +$any($event.target).value))"
                       min="1" />
                <button class="btn btn-light rounded-3 px-3"
                        (click)="max_capacity.set(max_capacity() + 1)">+</button>
              </div>
            </div>

            <!-- Hora apertura -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Hora de apertura</label>
              <input type="time" class="form-control rounded-3"
                     [value]="opening_time()"
                     (change)="opening_time.set($any($event.target).value)" />
            </div>

            <!-- Hora cierre -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Hora de cierre</label>
              <input type="time" class="form-control rounded-3"
                     [value]="closing_time()"
                     (change)="closing_time.set($any($event.target).value)" />
            </div>

            <!-- Parque -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Parque</label>
              <select class="form-select rounded-3"
                      [value]="park_id()"
                      (change)="park_id.set(+$any($event.target).value)">
                <option [value]="1">Parque 1</option>
                <option [value]="2">Parque 2</option>
              </select>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-3 mt-2">
              <button class="btn fw-bold px-5 py-2 text-white rounded-3"
                      style="background:#0cc0a8;"
                      [disabled]="guardando()"
                      (click)="guardar()">
                @if (guardando()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                Crear Restaurante
              </button>
              <button class="btn btn-light fw-medium px-4 py-2 rounded-3"
                      (click)="volver()">
                Cancelar
              </button>
            </div>

          </div>
        </div>
      </div>
    </main>
  </div>
</div>
