<div class="d-flex flex-column" style="min-height:100vh;">
  <app-admin-navbar />
  <div class="d-flex flex-grow-1">
    <app-admin-sidebar />
    <main class="flex-grow-1 overflow-auto p-4 p-lg-5" style="background:#f5f8f8;">

      <div class="d-flex align-items-center gap-3 mb-4">
        <button class="btn btn-light rounded-3 d-flex align-items-center gap-1" (click)="volver()">
          <span class="material-symbols-outlined" style="font-size:1.1rem;">arrow_back</span>
        </button>
        <div>
          <h1 class="fw-bold mb-0" style="font-size:1.6rem;">Nuevo Precio de Entrada</h1>
          <p class="text-muted small mb-0">Crea un nuevo tipo de entrada con su precio</p>
        </div>
      </div>

      @if (exito()) {
        <div class="alert alert-success d-flex align-items-center gap-2">
          <span class="material-symbols-outlined">check_circle</span>
          {{ exito() }}
        </div>
      }
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5">
            <h5 class="fw-bold mb-4">Datos del Precio</h5>

            <!-- Nombre del tipo -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Nombre del Tipo</label>
              <input type="text" class="form-control rounded-3"
                     [value]="nuevoTipo()"
                     (input)="nuevoTipo.set($any($event.target).value)"
                     placeholder="Ej: Entrada General, VIP, Familia..." />
            </div>

            <!-- Precios -->
            <div class="row g-3 mb-4">
              <div class="col-6">
                <label class="form-label fw-semibold small text-uppercase text-muted"
                       style="font-size:0.65rem;letter-spacing:0.1em;">Precio Adulto (€)</label>
                <input type="number" class="form-control rounded-3"
                       step="0.01" min="0"
                       [value]="price()"
                       (input)="price.set(+$any($event.target).value)"
                       placeholder="Ej: 25.00" />
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small text-uppercase text-muted"
                       style="font-size:0.65rem;letter-spacing:0.1em;">Precio Niño (€)</label>
                <input type="number" class="form-control rounded-3"
                       step="0.01" min="0"
                       [value]="priceChild()"
                       (input)="priceChild.set(+$any($event.target).value)"
                       placeholder="Ej: 15.00" />
              </div>
            </div>

            <!-- Parque -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase text-muted"
                     style="font-size:0.65rem;letter-spacing:0.1em;">Parque</label>
              <select class="form-select rounded-3"
                      [value]="park_id()"
                      (change)="park_id.set(+$any($event.target).value)">
                <option [value]="1">Parque 1</option>
                <option [value]="2">Parque 2</option>
              </select>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-3 mt-2">
              <button class="btn fw-bold px-5 py-2 text-white rounded-3"
                      style="background:#0cc0a8;"
                      [disabled]="guardando()"
                      (click)="guardar()">
                @if (guardando()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                Crear Precio
              </button>
              <button class="btn btn-light fw-medium px-4 py-2 rounded-3"
                      (click)="volver()">
                Cancelar
              </button>
            </div>

          </div>
        </div>
      </div>
    </main>
  </div>
</div>
