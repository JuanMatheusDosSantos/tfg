name: Deploy Mundo Marino

on:
  push:
    branches:
      - master  # Asegúrate de que tu rama se llame master (o cámbialo a master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Detener el script si hay errores y configurar Git
            set -e
            git config --global --add safe.directory /var/www/tfg
            git config --global --add safe.directory /var/www/tfg/Mundo_Marino_back
            git config --global --add safe.directory /var/www/tfg/Mundo_Marino_front
            
            # 2. Activar modo mantenimiento en Laravel
            cd /var/www/tfg/Mundo_Marino_back
            php artisan down --refresh=15 || true # El 'true' evita que falle si ya estaba desactivada
            
            # 3. Actualizar código
            cd /var/www/tfg
            git fetch origin master
            git reset --hard origin/master
            
            # 4. --- Configuración BACKEND (Laravel) ---
            cd Mundo_Marino_back
            composer install --no-interaction --optimize-autoloader
            
            # Ejecutar migraciones (sin borrar datos)
            php artisan migrate --force
            
            # Limpiar y recrear caché
            php artisan config:cache
            php artisan route:cache
            
            # 5. --- Configuración FRONTEND (Angular) ---
            cd ../Mundo_Marino_front
            npm install
            npm run build -- --configuration=production
            
            # 6. Desactivar modo mantenimiento
            cd ../Mundo_Marino_back
            php artisan up
            
            echo "¡Despliegue finalizado con éxito!"