name: Deploy Mundo Marino

on:
  push:
    branches:
      - master  # Asegúrate de que tu rama se llame master (o cámbialo a master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Configuración inicial y detener ante errores
            set -e
            git config --global --add safe.directory /var/www/tfg
            git config --global --add safe.directory /var/www/tfg/Mundo_Marino_back
            git config --global --add safe.directory /var/www/tfg/Mundo_Marino_front
            
            # 2. Entrar al Back y ACTIVAR Mantenimiento (Redirección total)
            cd /var/www/tfg/Mundo_Marino_back
            # Usamos --redirect="/" para que Laravel tome el control total del tráfico
            php artisan down --refresh=15 --redirect="/" || true 
            
            # 3. Actualizar código desde Git
            cd /var/www/tfg
            git fetch origin master
            git reset --hard origin/master
            
            # 4. --- Configuración BACKEND (Laravel) ---
            cd Mundo_Marino_back
            composer install --no-interaction --optimize-autoloader
            
            # Ejecutar migraciones y refrescar caché
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            
            # 5. --- Configuración FRONTEND (Angular) ---
            cd ../Mundo_Marino_front
            # Instalación y build (esto es lo que más tarda)
            npm install
            npm run build -- --configuration=production
            
            # 6. DESACTIVAR Mantenimiento y volver a la vida
            cd ../Mundo_Marino_back
            php artisan up
            
            echo "¡Despliegue finalizado con éxito!"